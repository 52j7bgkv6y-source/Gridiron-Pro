<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Gridiron Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d0b;--panel:#11161a;--line:rgba(232,239,230,.12);--chalk:#e8efe6;--muted:rgba(232,239,230,.6);--green:#4ade80;--amber:#fbbf24;--red:#f87171;--cyan:#7dd3fc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--chalk);font-family:Inter,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;display:none;z-index:5}
.layer.show{display:flex}
button{font:inherit;color:inherit}
.btn{background:linear-gradient(90deg,#4ade80,#22c55e);color:#06140b;border:0;border-radius:10px;padding:11px 18px;font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.07em;cursor:pointer}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--chalk);border:1px solid var(--line)}
.btn.big{font-size:26px;padding:13px 30px}
.btn:disabled{opacity:.4;cursor:default}
.m-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
/* title */
#title{align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 0%,rgba(20,83,45,.92),rgba(10,13,11,.97));overflow:auto;padding:20px}
.t-box{width:100%;max-width:760px;text-align:center;margin:auto}
.t-logo{font-family:'Bebas Neue',sans-serif;font-size:clamp(46px,9vw,84px);letter-spacing:.06em;line-height:.9}
.t-logo span{color:var(--green)}
.t-sub{color:var(--muted);margin:6px 0 20px}
.t-drop{border:2px dashed rgba(74,222,128,.4);border-radius:14px;padding:18px;background:rgba(0,0,0,.25)}
.t-drop.over{border-color:var(--green);background:rgba(74,222,128,.08)}
.t-drop-k{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.08em;color:var(--green)}
.t-drop-s{color:var(--muted);font-size:14px;margin-top:4px;line-height:1.5}
.t-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0 4px;text-align:left}
.t-opts label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.t-opts select,.t-opts input{background:#0d1114;color:var(--chalk);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:14px;font-family:Inter,sans-serif;user-select:text;-webkit-user-select:text}
.t-foot{color:rgba(232,239,230,.35);font-size:12px;margin-top:18px}
/* play call */
#call{flex-direction:column;background:rgba(6,9,7,.9);backdrop-filter:blur(4px);padding:calc(env(safe-area-inset-top) + 64px) 14px 14px;overflow:auto}
.call-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.call-k{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.06em}
.call-s{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:12px}
.call-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:6px 12px;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.07em;cursor:pointer}
.chip.on{border-color:rgba(74,222,128,.6);color:#86efac;background:rgba(74,222,128,.1)}
.call-q{background:#0d1114;border:1px solid var(--line);color:var(--chalk);border-radius:20px;padding:7px 12px;width:150px;user-select:text;-webkit-user-select:text}
.call-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;text-align:left;transition:transform .1s,border-color .1s}
.card:hover{transform:translateY(-2px);border-color:rgba(74,222,128,.5)}
.card canvas{width:100%;height:auto;border-radius:8px;display:block}
.card-n{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.04em;margin-top:5px;line-height:1.05}
.card-t{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.08em}
.call-empty{color:var(--muted);padding:30px;grid-column:1/-1;text-align:center}
/* hud */
#hud{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;z-index:8;display:none;align-items:center;gap:8px;flex-wrap:wrap;pointer-events:none}
#hud>*{pointer-events:auto}
.sb{display:flex;border-radius:9px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.4)}
.tm{padding:7px 12px;font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.05em}
.tm b{margin-left:8px;font-size:22px}
.tm.home{background:#1e40af}.tm.away{background:#991b1b}
.tm.poss::after{content:" ●";color:var(--amber);font-size:12px;vertical-align:middle}
.sb2,.sb3,.sb4{background:rgba(10,13,11,.85);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-family:'JetBrains Mono',monospace;font-size:12px}
.sb3{color:var(--amber)}
.sb4{color:var(--muted);max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb4 i{color:rgba(232,239,230,.35);font-style:normal;margin:0 4px}
.hb{margin-left:auto;background:rgba(10,13,11,.85);border:1px solid var(--line);border-radius:9px;padding:6px 11px;cursor:pointer;font-size:16px}
.hb+.hb{margin-left:0}
#hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);z-index:7;background:rgba(10,13,11,.82);border:1px solid var(--line);border-radius:20px;padding:8px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;display:none;white-space:nowrap;pointer-events:none}
/* touch controls */
#ctl{pointer-events:none;inset:auto 0 0 0;height:0;z-index:7}
#btns{position:fixed;right:calc(env(safe-area-inset-right) + 12px);bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-wrap:wrap-reverse;gap:8px;justify-content:flex-end;max-width:240px;pointer-events:auto}
.tb{width:72px;height:56px;border-radius:14px;background:rgba(17,22,26,.85);border:1px solid rgba(232,239,230,.2);font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.06em;cursor:pointer;touch-action:none}
.tb.big{width:96px;height:72px;font-size:22px;background:rgba(74,222,128,.22);border-color:rgba(74,222,128,.6);color:#bbf7d0}
.tb.on,.tb:active{background:rgba(250,204,21,.25);border-color:rgba(250,204,21,.7)}
#stick{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.05);display:none;z-index:9;pointer-events:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.3)}
/* result / modal / final */
#result{align-items:flex-end;justify-content:center;pointer-events:none;padding-bottom:calc(env(safe-area-inset-bottom) + 24px);background:linear-gradient(transparent 55%,rgba(0,0,0,.55))}
#result>*{pointer-events:auto}
#result{flex-direction:column;align-items:center}
.res-h{font-family:'Bebas Neue',sans-serif;font-size:clamp(34px,6vw,58px);letter-spacing:.05em;text-shadow:0 4px 18px rgba(0,0,0,.8);text-align:center}
.res-s{color:#e2e8f0;font-family:'JetBrains Mono',monospace;font-size:13px;text-shadow:0 2px 8px #000;text-align:center;max-width:90vw}
#modal{align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:20;padding:16px}
.m-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:620px;width:100%;text-align:center;max-height:90vh;overflow:auto}
.m-k{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.06em;color:var(--amber)}
.m-t{color:var(--muted);margin-top:4px}
.m-note{color:var(--muted);font-size:13px;margin-top:12px;line-height:1.5}
.help{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;text-align:left}
.help td,.help th{padding:6px;border-bottom:1px solid var(--line)}
.help th{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.1em}
#final{align-items:center;justify-content:center;flex-direction:column;background:rgba(6,9,7,.94);padding:20px;text-align:center}
.fin-k{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--amber);letter-spacing:.1em}
.fin-s{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,8vw,72px)}
.fin-m{color:var(--muted)}
.fin-log{max-height:36vh;overflow:auto;margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);text-align:left;width:min(620px,92vw)}
#toast{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 64px);left:50%;transform:translateX(-50%) translateY(10px);opacity:0;transition:all .25s;z-index:30;background:rgba(17,22,26,.95);border:1px solid rgba(250,204,21,.45);color:#fde68a;border-radius:20px;padding:8px 16px;font-size:13px;pointer-events:none;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:640px){.sb4{display:none}.tm{font-size:16px;padding:6px 9px}.tm b{font-size:19px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="hud"></div>
  <div id="hint"></div>
  <div class="layer" id="ctl"><div id="btns"></div></div>
  <div id="stick"><div id="knob"></div></div>
  <div class="layer" id="call"></div>
  <div class="layer" id="result"></div>
  <div class="layer" id="final"></div>
  <div class="layer" id="title"></div>
  <div class="layer" id="modal"></div>
  <div id="toast"></div>
</div>
<script id="gridiron-sim-engine">
/* ═══════════════════════════════════════════════════════════════════════════
   GRIDIRON SIM ENGINE — shared by Gridiron's SIM mode and Gridiron Game.
   Pure JavaScript, no DOM. Keep this block IDENTICAL in index.html and
   game.html, and bump SIM_VERSION whenever it changes.

   Units are YARDS. x runs across the field (0 = left sideline, 53.33 = right).
   y is measured from the line of scrimmage, positive toward the defense's end
   zone (the way the offense is going). The engine reads Gridiron plays
   directly: players, routes (with owner, follow-up and option chains),
   coverages (zones with coach rules, man links), the ball plan (snap, steps,
   reads, dropback, RPO) and blitz order.

   Gridiron draws the backfield and defensive alignments deeper than real life
   (the player icons are big), while routes and zones are drawn to the yard
   lines. The import compresses ALIGNMENT depth near the line and keeps routes
   and zones 1:1, so a 12-yard dig is still 12 yards.
   ═══════════════════════════════════════════════════════════════════════════ */
(function (root) {
"use strict";
const SIM_VERSION = "sim-1.1";

// ── Gridiron field geometry (must match the editor) ─────────────────────────
const G_FW = 480, G_FH = 820, G_EZ = 68;
const YPY = (G_FH - G_EZ * 2) / 100;    // px per yard downfield (6.84)
const XPY = G_FW / (160 / 3);           // px per yard across (9)
const G_LOS_Y = G_FH - G_EZ - 35 * YPY;
const G_BALL_X = G_FW / 2;
const FIELD_W = 160 / 3;
const DT = 0.05;                        // sim tick (s)
const MAX_T = 11;                       // hard stop for a play (s)
const DROPBACK_YARDS = { quick: 1, "1": 2, "3": 4, "5": 6.5, "7": 9 };
const DROP_TIME = { quick: 0.35, "1": 0.5, "3": 0.85, "5": 1.25, "7": 1.6 };

// ── Small utilities ─────────────────────────────────────────────────────────
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const hyp = Math.hypot;
const lerp = (a, b, f) => a + (b - a) * f;
function makeRng(seed) {
    let a = (seed >>> 0) || 0x9e3779b9;
    const f = function () {
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.gauss = () => { let u = 0, v = 0; while (u === 0) u = f(); while (v === 0) v = f(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    f.chance = (p) => f() < p;
    f.range = (lo, hi) => lo + (hi - lo) * f();
    return f;
}
function norm(x, y) { const d = Math.hypot(x, y); return d > 1e-9 ? { x: x / d, y: y / d, d } : { x: 0, y: 0, d: 0 }; }
function distPtSeg(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
    const t = L2 > 1e-9 ? clamp(((px - ax) * dx + (py - ay) * dy) / L2, 0, 1) : 0;
    return { d: Math.hypot(px - (ax + dx * t), py - (ay + dy * t)), t };
}

// ── Ratings ─────────────────────────────────────────────────────────────────
// 0–100 like a video game. Every player gets his position's base, then the
// unit "talent" knob (−30…+30) shifts the whole unit.
const STAT_KEYS = ["spd", "acc", "agi", "str", "cth", "rr", "elu", "pbk", "rbk", "prs", "bsh", "tak", "man", "zcv", "bsk", "thp", "tha", "awr"];
const ROLE_BASE = {
    QB: { spd: 70, acc: 74, agi: 70, str: 60, cth: 45, rr: 40, elu: 62, pbk: 30, rbk: 30, tak: 30, thp: 82, tha: 80, awr: 78 },
    HB: { spd: 87, acc: 88, agi: 86, str: 66, cth: 66, rr: 58, elu: 82, pbk: 56, rbk: 46, tak: 35, thp: 40, tha: 35, awr: 66 },
    FB: { spd: 76, acc: 78, agi: 70, str: 80, cth: 62, rr: 45, elu: 56, pbk: 70, rbk: 74, tak: 45, awr: 66 },
    WR: { spd: 89, acc: 87, agi: 86, str: 55, cth: 80, rr: 80, elu: 76, pbk: 34, rbk: 46, tak: 35, awr: 70 },
    TE: { spd: 78, acc: 78, agi: 72, str: 72, cth: 74, rr: 66, elu: 60, pbk: 64, rbk: 68, tak: 40, awr: 68 },
    OL: { spd: 52, acc: 62, agi: 52, str: 86, cth: 20, rr: 10, elu: 20, pbk: 76, rbk: 76, tak: 40, awr: 72 },
    DL: { spd: 68, acc: 76, agi: 64, str: 86, prs: 76, bsh: 76, tak: 74, man: 25, zcv: 35, bsk: 35, awr: 70 },
    LB: { spd: 80, acc: 82, agi: 76, str: 74, prs: 62, bsh: 70, tak: 78, man: 62, zcv: 68, bsk: 55, awr: 72 },
    DB: { spd: 89, acc: 88, agi: 86, str: 58, cth: 55, prs: 46, bsh: 48, tak: 66, man: 78, zcv: 75, bsk: 68, awr: 72 },
    K: { spd: 62, acc: 64, agi: 60, str: 50, cth: 40, elu: 40, tak: 30, thp: 70, tha: 60, awr: 60 },
};
const KNOB_OF_ROLE = { QB: "qb", OL: "ol", WR: "skill", TE: "skill", HB: "skill", FB: "skill", K: "skill", DL: "dl", LB: "lb", DB: "db" };
function ratingsFor(role, knobs, over) {
    const base = ROLE_BASE[role] || ROLE_BASE.WR;
    const k = (knobs && knobs[KNOB_OF_ROLE[role]]) || 0;
    const r = {};
    STAT_KEYS.forEach(s => { r[s] = clamp((base[s] != null ? base[s] : 40) + k, 15, 99); });
    if (over) Object.keys(over).forEach(s => { if (typeof over[s] === "number") r[s] = clamp(over[s], 1, 99); });
    return r;
}

// ── Gridiron → sim coordinate import ────────────────────────────────────────
// Depth compression for ALIGNMENTS (see header). Offense backfield: an OL drawn
// 15px off the line sits 0.6yd back, a gun QB drawn 72px deep sits ~5yd back.
function offBackMap(d) { if (d <= 2.2) return d * 0.2727; if (d <= 12) return 0.6 + (d - 2.2) * 0.55; return 6.0 + (d - 12); }
// Defensive alignment depth: DL 0.8yd, apex/LB ~5–6yd, safeties ~11–12yd.
function defMap(d) { if (d <= 2.2) return d * 0.3636; if (d <= 16) return 0.8 + (d - 2.2) * 0.75; return 11.15 + (d - 16); }
function relOf(pt, ctx) { return { x: (pt.x - ctx.ballX) / XPY, d: (ctx.losY - pt.y) / YPY }; }
function mapPt(pt, ctx, side) {
    const r = relOf(pt, ctx);
    if (r.d < 0) return { x: r.x, y: -offBackMap(-r.d) };
    return { x: r.x, y: side === "D" ? defMap(r.d) : r.d };
}
function playCtx(play) {
    return { ballX: typeof play.ballX === "number" ? play.ballX : G_BALL_X, losY: typeof play.losY === "number" ? play.losY : G_LOS_Y };
}

// Route ownership — same rules as the editor's PLAY IN ACTION: an explicit
// ownerId always wins; an ownerless legacy route may claim only a player who
// owns no route, within 40px of its first point (or last point for a blitz).
function resolveOwners(players, routes) {
    const byId = new Map(players.map(p => [p.id, p]));
    const owned = new Set();
    routes.forEach(r => { if (r && r.ownerId && byId.has(r.ownerId)) owned.add(r.ownerId); });
    const ownerOf = new Map();
    const nearestFree = (pt) => {
        let best = null, bd = Infinity;
        players.forEach(p => { if (owned.has(p.id)) return; const d = Math.hypot(p.x - pt.x, p.y - pt.y); if (d < bd) { bd = d; best = p; } });
        return best && bd < 40 ? best.id : null;
    };
    routes.forEach(r => {
        if (!r || !r.points || !r.points.length) return;
        if (r.ownerId && byId.has(r.ownerId)) { ownerOf.set(r.id, r.ownerId); return; }
        if (r.optionOf || r.attachedToMotion) return; // inherit below
        let o = nearestFree(r.points[0]);
        if (!o && (r.rtype === "showBlitz" || r.rtype === "hideBlitz")) o = nearestFree(r.points[r.points.length - 1]);
        if (o) ownerOf.set(r.id, o);
    });
    for (let pass = 0; pass < 4; pass++) {
        routes.forEach(r => {
            if (!r || ownerOf.has(r.id)) return;
            const par = r.optionOf || r.attachedToMotion;
            if (par && ownerOf.has(par)) ownerOf.set(r.id, ownerOf.get(par));
        });
    }
    return ownerOf;
}

// Per-player route chains: pre-snap motion, then the main chain of legs (the
// primary route plus its follow-ups), plus option branches.
function buildPlans(players, routes, ownerOf) {
    const fuByParent = new Map();
    routes.forEach(r => { if (r && r.attachedToMotion && !fuByParent.has(r.attachedToMotion)) fuByParent.set(r.attachedToMotion, r); });
    const isFU = new Set(routes.filter(r => r && r.attachedToMotion).map(r => r.id));
    const plans = new Map();
    const get = (pid) => { if (!plans.has(pid)) plans.set(pid, { pre: null, primary: null, legs: [], options: [] }); return plans.get(pid); };
    routes.forEach(r => {
        if (!r || r.rtype !== "preSnapMotion" || r.optionOf || !r.points || r.points.length < 2) return;
        const o = ownerOf.get(r.id); if (!o) return;
        const pl = get(o); if (!pl.pre) pl.pre = r;
    });
    routes.forEach(r => {
        if (!r || !r.points || r.points.length < 2) return;
        if (r.optionOf || r.rtype === "option" || r.rtype === "preSnapMotion" || isFU.has(r.id)) return;
        const o = ownerOf.get(r.id); if (!o) return;
        const pl = get(o); if (!pl.primary) pl.primary = r;
    });
    plans.forEach(pl => { if (pl.pre) { const fu = fuByParent.get(pl.pre.id); if (fu) pl.primary = fu; } });
    plans.forEach(pl => {
        let cur = pl.primary; const seen = new Set();
        while (cur && !seen.has(cur.id) && cur.points && cur.points.length >= 2) { seen.add(cur.id); pl.legs.push(cur); cur = fuByParent.get(cur.id); }
    });
    routes.forEach(r => {
        if (!r || !r.points || r.points.length < 2) return;
        if (r.optionOf) {
            plans.forEach(pl => { const li = pl.legs.findIndex(l => l.id === r.optionOf); if (li >= 0) pl.options.push({ leg: li, at: r.attachIdx != null ? r.attachIdx : 0, route: r }); });
        } else if (r.rtype === "option") {
            const o = ownerOf.get(r.id); if (!o) return;
            const pl = get(o); if (pl.legs.length) pl.options.push({ leg: 0, at: 0, route: r });
        }
    });
    return plans;
}

// Gridiron's own route-shape classifier (used by zone coach rules), on raw px.
function classifyRoutePx(pts) {
    if (!pts || pts.length < 2) return "any";
    const start = pts[0], end = pts[pts.length - 1];
    let minY = start.y, di = 0;
    pts.forEach((p, i) => { if (p.y < minY) { minY = p.y; di = i; } });
    const deep = { x: pts[di].x, y: minY }, n = pts.length;
    const depth = start.y - deep.y;
    const awaySign = start.x < G_FW / 2 ? -1 : 1;
    if (depth < YPY * 3) { const lat = end.x - start.x; if (Math.abs(lat) < YPY * 2) return "any"; return (lat * awaySign) > 0 ? "flat" : "cross"; }
    if ((end.y - deep.y) > YPY * 2 && Math.abs(end.x - deep.x) < YPY * 3) return "comeback";
    if (di >= 0.7 * (n - 1)) { const lat = end.x - start.x; if (Math.abs(lat) < YPY * 2.5) return "vertical"; return (lat * awaySign) > 0 ? "corner" : "post"; }

    if (Math.abs(lat) < YPY * 2) return "vertical";
    return (lat * awaySign) > 0 ? "out" : "in";
}

const OFF_ROLES = { QB: 1, HB: 1, FB: 1, WR: 1, TE: 1, OL: 1, K: 1 };
const DEF_ROLES = { DL: 1, LB: 1, DB: 1 };
// rel is RAW ball-relative yards {x, d} (d > 0 = beyond the line).
function inferRole(p, side, rel) {
    const r = String(p.role || "").toUpperCase();
    if (side === "O" && OFF_ROLES[r]) return r;
    if (side === "O" && r === "P") return "K";
    if (side === "D" && DEF_ROLES[r]) return r;
    const L = String(p.label || "").toUpperCase();
    if (side === "O") {
        const back = -rel.d;
        if (/^(QB|WC)$/.test(L)) return "QB";
        if (/^(C|G|T|LT|RT|LG|RG|OL|LS|OT|OG)$/.test(L)) return "OL";
        if (Math.abs(rel.x) < 5.6 && back < 3.4) return "OL";
        if (/^(TE|Y)$/.test(L) && Math.abs(rel.x) < 9) return "TE";
        if (Math.abs(rel.x) < 4.5 && back >= 3.4) return "HB";
        return "WR";
    }
    if (rel.d < 3.4 && Math.abs(rel.x) < 7.5) return "DL";
    if (Math.abs(rel.x) < 8 && rel.d < 12.5) return "LB";

// DBs keep most of their drawn depth (a corner drawn 3yd off is a press-bail

function convFor(ctx, side, role) {
    if (side === "D" && role === "DB") return (pt) => { const r = relOf(pt, ctx); return r.d >= 0 ? { x: r.x, y: Math.max(defMap(r.d), r.d * 0.88) } : { x: r.x, y: -offBackMap(-r.d) }; };

}

// Pull one side of a Gridiron play into ball-relative sim coordinates.
function extractSide(play, side) {

    const all = (play.players || []).filter(p => p && typeof p.x === "number");
    const mine = all.filter(p => (side === "O" ? (p.ptype || "offense") === "offense" : p.ptype === "defense"));

    const ids = new Set(mine.map(p => p.id));
    const out = mine.map(p => {
        const rawRel = relOf(p, ctx);
        const role = inferRole(p, side, rawRel);
        const conv = convFor(ctx, side, role);
        const pos = conv(p);
        const pl = plans.get(p.id) || { pre: null, legs: [], options: [] };
        const legs = pl.legs.map(l => ({ id: l.id, rtype: l.rtype, pts: l.points.map(conv), holdBlock: !!l.holdBlock, order: l.order, motionStyle: l.motionStyle, shape: classifyRoutePx(l.points) }));
        const pre = pl.pre ? { id: pl.pre.id, pts: pl.pre.points.map(conv), motionStyle: pl.pre.motionStyle || "set", order: pl.pre.order } : null;
        const options = pl.options.map(o => ({ leg: o.leg, at: o.at, pts: o.route.points.map(conv) }));
        let shape = "any";
        const passLeg = pl.legs.find(l => l.rtype === "pass") || pl.legs[0];
        if (passLeg) shape = classifyRoutePx(passLeg.points);
        return { id: p.id, label: p.label || p.role || "?", rawRole: p.role, role, color: p.color, x: pos.x, y: pos.y, side, pre, legs, options, shape };
    });

            if (!c) return;
            if (c.ctype === "man" && ids.has(c.fromId) && c.toId) man.push({ from: c.fromId, to: c.toId, mode: c.mode === "overTop" ? "overTop" : "trail" });

                const ap = all.find(p => p.id === c.attachedTo);
                let cx = c.x + c.w / 2, cy = c.y + c.h / 2;
                if (ap && (typeof c.offX === "number" || typeof c.offY === "number")) { cx = ap.x + (c.offX || 0); cy = ap.y + (c.offY || 0); }
                cx += c.dropDx || 0; cy += c.dropDy || 0;
                const rules = (c.rules && c.rules.length) ? c.rules : (c.react ? [{ route: "vertical", react: c.react }] : []);

            }

    }

    const other = all.filter(p => (side === "O" ? p.ptype === "defense" : (p.ptype || "offense") === "offense")).map(p => {
        const os = side === "O" ? "D" : "O";
        const role = inferRole(p, os, relOf(p, ctx));
        const pos = convFor(ctx, os, role)(p);
        return { id: p.id, label: p.label, x: pos.x, y: pos.y, role };
    });
    const bp = play.ballPlan || {};
    return {
        side, players: out, zones, man, look: other, ballX: ctx.ballX / XPY, ytg: (ctx.losY - G_EZ) / YPY,
        ballPlan: side === "O" ? { snapTo: bp.snapTo || null, steps: (bp.steps || []).map(s => ({ ...s, toPoint: s.toPoint ? mapPt(s.toPoint, ctx, "O") : null })), reads: bp.reads || {}, dropback: bp.dropback || null, rpo: !!bp.rpo, olEligible: !!bp.olEligible, noSnap: !!bp.noSnap } : null,
        name: play.name || "", id: play.id, category: play.category,
    };
}

// ── Formation structure & defensive alignment adjustment ────────────────────
// Receivers are numbered from the sideline in (#1, #2, #3) on each side, backs
// are B1/B2. A defense drawn against one formation is re-aligned to another by
// those numbers: the corner on #1 stays on #1, the nickel on #2 goes to the new
// #2. If the strength flips (3x1 left vs 3x1 right) the call is mirrored.
function structureOf(players, snapId) {
    const ol = players.filter(p => p.role === "OL");
    const minX = ol.length ? Math.min.apply(null, ol.map(p => p.x)) : -3;
    const maxX = ol.length ? Math.max.apply(null, ol.map(p => p.x)) : 3;
    const elig = players.filter(p => p.role !== "OL" && p.id !== snapId && p.role !== "QB");
    const left = [], right = [], back = [];

    const keys = new Map();
    left.forEach((p, i) => keys.set(p.id, "L" + (i + 1)));
    right.forEach((p, i) => keys.set(p.id, "R" + (i + 1)));
    back.forEach((p, i) => keys.set(p.id, "B" + (i + 1)));
    let strength = right.length > left.length ? "R" : left.length > right.length ? "L" : null;
    if (!strength) {

        if (te) strength = te.x < 0 ? "L" : "R";

function findByKey(S, key, exact) {

}
function mirrorDefense(D) {
    D.players.forEach(p => { p.x = -p.x; if (p.pre) p.pre.pts.forEach(q => { q.x = -q.x; }); p.legs.forEach(l => l.pts.forEach(q => { q.x = -q.x; })); p.options.forEach(o => o.pts.forEach(q => { q.x = -q.x; })); });

    const snapO = O.snapId;

    const look = D.look.filter(p => p.y < 0.5 || p.role === "OL" || true);
    const lookSnap = (look.find(p => p.role === "QB") || {}).id;
    let SL = look.length ? structureOf(look, lookSnap) : null;
    if (SL && SL.strength && SO.strength && SL.strength !== SO.strength) {

    }
    const lookById = new Map(D.look.map(p => [p.id, p]));
    const manOf = new Map(D.man.map(m => [m.from, m]));
    const moved = new Map();
    D.players.forEach(d => {
        let key = null, anchor = null;
        const m = manOf.get(d.id);

        if (!key && SL && d.role !== "DL") {

    if (D.man.length >= 3) {
        const elig = [...SO.left, ...SO.right, ...SO.back].filter(r => !covered.has(r.id));
        const blitzers = new Set(D.players.filter(d => d.legs.some(l => l.rtype === "showBlitz" || l.rtype === "hideBlitz")).map(d => d.id));
        elig.forEach(r => {
            const deepIds = new Set(D.zones.filter(z => z.cy >= 11).map(z => z.owner));
            const cand = D.players.filter(d => d.role !== "DL" && !blitzers.has(d.id) && !D.man.some(m => m.from === d.id) && !deepIds.has(d.id));
            let best = null, bd = Infinity;
            cand.forEach(d => { const dd = Math.hypot(d.x - r.x, d.y - r.y); if (dd < bd) { bd = dd; best = d; } });
            if (best && bd < 16) {
                D.man.push({ from: best.id, target: best && r.id, mode: "trail" });
                D.zones = D.zones.filter(z => z.owner !== best.id);
                covered.set(r.id, best.id);
                notes.push("Man check: " + best.label + " picks up " + r.label + ".");
            }
        });
    }
}

// ── Built-in looks (used only when the playbook has no play for one side) ───
function builtinDefense(name) {
    const P = (id, label, role, x, y) => ({ id, label, role, x: G_BALL_X + x * XPY, y: G_LOS_Y - y * YPY, ptype: "defense" });
    const Zc = (owner, label, cx, cy, w, h) => ({ id: "z_" + owner, ctype: "zone", shape: "ellipse", x: G_BALL_X + cx * XPY - w * XPY / 2, y: G_LOS_Y - cy * YPY - h * YPY / 2, w: w * XPY, h: h * YPY, attachedTo: owner, label });

    const cb1 = P("cb1", "C", "DB", -18, 7), cb2 = P("cb2", "C", "DB", 18, 7);
    const players = [...front, P("lb1", "W", "LB", -4.5, 9), P("lb2", "M", "LB", 0, 9.4), P("lb3", "S", "LB", 4.5, 9), cb1, cb2, P("s1", "$", "DB", -6.5, 16.5), P("s2", "F", "DB", 6.5, 16.5)];
    const cov = [];
    const routes = [];
    if (name === "Cover 3") {
        players.find(p => p.id === "s1").y = G_LOS_Y - 11 * YPY;
        cov.push(Zc("cb1", "⅓", -17.8, 19, 17.8, 14), Zc("s2", "⅓", 0, 19, 17.8, 14), Zc("cb2", "⅓", 17.8, 19, 17.8, 14), Zc("s1", "FLAT", -18, 4, 10, 6), Zc("lb3", "FLAT", 18, 4, 10, 6), Zc("lb1", "HOOK", -6, 6.5, 13, 9), Zc("lb2", "HOOK", 6, 6.5, 13, 9));
    } else if (name === "Cover 2") {
        cov.push(Zc("s1", "½", -13.3, 19, 26.7, 14), Zc("s2", "½", 13.3, 19, 26.7, 14), Zc("cb1", "FLAT", -20, 3.5, 10, 6), Zc("cb2", "FLAT", 20, 3.5, 10, 6), Zc("lb1", "HOOK", -9, 6.5, 10, 9), Zc("lb2", "HOOK", 0, 6.5, 10, 9), Zc("lb3", "HOOK", 9, 6.5, 10, 9));
    } else if (name === "Cover 4") {
        cov.push(Zc("cb1", "¼", -20, 19, 13.3, 14), Zc("s1", "¼", -6.7, 19, 13.3, 14), Zc("s2", "¼", 6.7, 19, 13.3, 14), Zc("cb2", "¼", 20, 19, 13.3, 14), Zc("lb1", "FLAT", -18, 4, 10, 6), Zc("lb3", "FLAT", 18, 4, 10, 6), Zc("lb2", "HOOK", 0, 6.5, 13, 9));

        if (name === "Cover 1") cov.push(Zc("s2", "POST", 0, 19, 20, 14));
        else routes.push({ id: "b1", rtype: "showBlitz", ownerId: "s2", points: [{ x: G_BALL_X + 6.5 * XPY, y: G_LOS_Y - 16.5 * YPY }, { x: G_BALL_X + 3.2 * XPY, y: G_LOS_Y + 1 * YPY }] });
        routes.push({ id: "b2", rtype: "showBlitz", ownerId: "lb2", points: [{ x: G_BALL_X, y: G_LOS_Y - 9.4 * YPY }, { x: G_BALL_X - 1.2 * XPY, y: G_LOS_Y + 1 * YPY }] });
    }
    return { id: "builtin:" + name, name: name + " (built-in)", category: "defense", players, routes, coverages: cov, ballX: G_BALL_X, losY: G_LOS_Y, builtin: true };
}
const BUILTIN_DEFENSES = ["Cover 1", "Cover 2", "Cover 3", "Cover 4", "Cover 0"];

// ── Matchup ─────────────────────────────────────────────────────────────────
// buildMatchup(offPlay, defPlay) → everything the sim needs, plus notes that
// explain what the import had to adjust.
function buildMatchup(offPlay, defPlay, opts) {
    opts = opts || {};

    const O = extractSide(offPlay, "O");
    const D = extractSide(defPlay, "D");
    const same = offPlay === defPlay || (offPlay && defPlay && offPlay.id && offPlay.id === defPlay.id);
    // snap receiver
    let snap = O.players.find(p => p.id === O.ballPlan.snapTo) || O.players.find(p => p.role === "QB");
    if (!snap) {
        let best = null, bd = Infinity;
        O.players.forEach(p => { if (p.role === "OL") return; const d = Math.abs(p.x) + Math.max(0, -p.y - 0.5) * 0.3; if (p.y < -0.5 && d < bd) { bd = d; best = p; } });

    O.players.forEach(p => { if (p.role === "QB" && p !== snap) p.role = "HB"; });
    if (!O.players.length) notes.push("The offense play has no offensive players.");
    if (!D.players.length) notes.push("The defense play has no defenders.");
    if (D.players.length && !D.zones.length && !D.man.length) notes.push("This defense has no zones or man coverage drawn, so its defenders play generic spots (deep for corners and safeties, underneath for the rest). Use AUTO-COVER or draw man links for a real coverage.");
    if (!same && D.players.length && O.players.length) alignDefense(D, O, notes);
    else D.man.forEach(m => { m.target = m.to; });
    // Built-in Cover 1/0 links point at "__L1"/"__R1" placeholders.
    if (D.man.some(m => String(m.to || "").startsWith("__"))) {
        const SO = structureOf(O.players, O.snapId);
        D.man.forEach(m => { if (String(m.to).startsWith("__")) { const t = findByKey(SO, m.to.slice(2)); m.target = t ? t.id : null; } });

    }
    const ballX = clamp(opts.ballX != null ? opts.ballX : O.ballX, 1, FIELD_W - 1);

    return {
        version: SIM_VERSION, offName: O.name, defName: D.name, offId: O.id, defId: D.id,

}

// ════════════════════════════════════════════════════════════════════════════
//  SIMULATION

function createSim(M, opts) {
    opts = opts || {};

   GRIDIRON GAME — play your own playbook. Upload a Gridiron playbook export,

// ── teams ──

// ── game state ──

//  PLAY CALLING

// ════════════════════════════════════════════════════════════════════════
//  RUNNING A PLAY

        $("[data-quit]", m).onclick = () => { closeModal(); G.P = null; G.gm = null; ["call", "result", "ctl", "final"].forEach(hideLayer); showTitle(); };
    });
}
function controlsHelp() {
    modal(`<div class="m-k">CONTROLS</div><table class="help">
      <tr><th></th><th>Keyboard</th><th>Controller</th><th>Touch</th></tr>
      <tr><td>Move</td><td>WASD / arrows</td><td>Left stick</td><td>Drag left side</td></tr>
      <tr><td>Sprint</td><td>Shift</td><td>RT</td><td>Hold SPRINT</td></tr>
      <tr><td>Snap / ready</td><td>Space</td><td>A or Start</td><td>SNAP</td></tr>
      <tr><td>Throw to receiver</td><td>1–5 (Shift = lob)</td><td>A B X Y RB (hold LT = lob)</td><td>Tap the bubble</td></tr>
      <tr><td>Throw away</td><td>T</td><td>LB</td><td>AWAY</td></tr>
      <tr><td>Juke · Spin · Truck · Dive</td><td>J · K · L · Space</td><td>X · B · Y · A</td><td>Buttons</td></tr>
      <tr><td>Switch defender</td><td>Q / Tab</td><td>LB</td><td>SWITCH or tap him</td></tr>
      <tr><td>Tackle · Swat</td><td>Space · E</td><td>A · Y</td><td>TACKLE · SWAT</td></tr>
      <tr><td>Camera</td><td>C</td><td></td><td>🎥</td></tr></table>
      <div class="m-note">You can let go of the controls at any time: the AI plays your man's assignment until you move him. At QB the drop is automatic; move the stick to scramble.</div>
      <div class="m-row"><button class="btn" data-x>GOT IT</button></div>`, (m) => { $("[data-x]", m).onclick = closeModal; });
}

// ════════════════════════════════════════════════════════════════════════
//  TITLE / SETUP
// ════════════════════════════════════════════════════════════════════════
function showTitle() {
    G.screen = "title"; updateHUD(); hideLayer("ctl");
    const el = $("#title");
    const b = G.book;
    el.innerHTML = `<div class="t-box">
      <div class="t-logo">GRIDIRON <span>GAME</span></div>
      <div class="t-sub">Your playbook, played out with real football logic.</div>
      <div class="t-drop" id="drop">
        <div class="t-drop-k">${b ? "PLAYBOOK LOADED" : "UPLOAD YOUR PLAYBOOK"}</div>
        <div class="t-drop-s">${b ? `<b>${esc(b.name)}</b> · ${b.offense.length} offense · ${b.defense.length} defense plays` : "In Gridiron: MENU → Export JSON (or Backup). Then drop the file here or tap to choose it."}</div>
        <input type="file" id="file" accept=".json,application/json" hidden>
        <div class="m-row"><button class="btn ghost" data-pick>${b ? "UPLOAD A DIFFERENT FILE" : "CHOOSE FILE"}</button>${G.oppBook ? `<button class="btn ghost" data-clearopp>OPPONENT: ${esc(G.oppBook.name)} ✕</button>` : `<button class="btn ghost" data-opp>OPPONENT PLAYBOOK (OPTIONAL)</button>`}</div>
        <input type="file" id="file2" accept=".json,application/json" hidden>
      </div>
      <div class="t-opts">
        <label>MODE<select data-s="mode"><option value="game">Full game</option><option value="offense">Offense practice</option><option value="defense">Defense practice</option></select></label>
        <label>QUARTERS<select data-s="qlen"><option value="3">3 min</option><option value="5">5 min</option><option value="8">8 min</option><option value="15">15 min</option></select></label>
        <label>QB<select data-s="qb"><option value="you">You throw</option><option value="ai">AI reads, you can throw first</option></select></label>
        <label>DIFFICULTY<select data-s="diff"><option value="-15">Rookie</option><option value="0">Pro</option><option value="10">All-Pro</option><option value="20">All-Madden</option></select></label>
        <label>YOUR TEAM<input data-s="homeName" maxlength="12"></label>
        <label>OPPONENT<input data-s="awayName" maxlength="12"></label>
      </div>
      <div class="m-row"><button class="btn big" data-start ${b ? "" : "disabled"}>KICK OFF ▸</button><button class="btn ghost" data-help>CONTROLS</button></div>
      <div class="t-foot">Both teams use the uploaded playbook unless you add an opponent playbook. Sim engine ${esc(E.SIM_VERSION)} — the same engine as Gridiron's SIM mode.</div>
    </div>`;
    $$("[data-s]", el).forEach(i => { i.value = String(G.settings[i.dataset.s]); i.onchange = () => { const k = i.dataset.s; G.settings[k] = (k === "qlen" || k === "diff") ? +i.value : i.value; DB.set("settings", G.settings); }; });
    const file = $("#file", el), file2 = $("#file2", el);
    $("[data-pick]", el).onclick = () => file.click();
    const opp = $("[data-opp]", el); if (opp) opp.onclick = () => file2.click();
    const co = $("[data-clearopp]", el); if (co) co.onclick = () => { G.oppBook = null; DB.set("oppBook", null); showTitle(); };
    file.onchange = () => loadFile(file.files[0], false);
    file2.onchange = () => loadFile(file2.files[0], true);
    const drop = $("#drop", el);
    drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) loadFile(f, false); };
    $("[data-start]", el).onclick = () => { if (!G.book) return; hideLayer("title"); newGame(); toast("Kickoff: touchback · " + teamName(G.gm.poss) + " ball on the 25"); nextSnap(); };
    $("[data-help]", el).onclick = controlsHelp;
    showLayer("title");
}
function loadFile(f, opp) {
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
        try {
            const bk = parsePlaybook(String(rd.result), f.name.replace(/\.json$/i, ""));
            if (!bk.offense.length && !bk.defense.length) throw new Error("No offense or defense plays with players in that file.");
            if (opp) { G.oppBook = bk; DB.set("oppBook", bk); } else { G.book = bk; DB.set("book", bk); }
            toast(`Loaded ${bk.offense.length} offense and ${bk.defense.length} defense plays`);
        } catch (e) { toast(e.message || String(e)); }
        showTitle();
    };
    rd.readAsText(f);
}

// ── boot ──
async function boot() {
    resize(); setupTouch();
    const s = await DB.get("settings"); if (s) Object.assign(G.settings, s);
    G.book = await DB.get("book"); G.oppBook = await DB.get("oppBook");
    showTitle();
    requestAnimationFrame(render);
    if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); }); }
}
window.GridironGame = { G, parsePlaybook, startPlay, snap, newGame, nextSnap, showCall, pickPlay, throwTo };
boot();
})();
</script>
